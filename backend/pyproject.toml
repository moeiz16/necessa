[project]
name = "necessa"
version = "0.1.0"
description = "Necessa — medical-necessity intelligence for prior authorization & denial appeals (hybrid RAG platform)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.12",
  "orjson>=3.10",
  # config / models
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  # db
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  # security
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "cryptography>=43",
  # ai / rag (NO local models — all inference via cloud free tiers)
  "litellm>=1.55",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "qdrant-client>=1.12",
  "httpx>=0.27",
  "tenacity>=9.0",
  "sqlglot>=25.0",
  "selectolax>=0.3.21",
  "snowballstemmer>=2.2",
  "pypdf>=5.1",
  "numpy>=1.26",
  # infra
  "redis>=5.2",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "typer>=0.13",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "fakeredis>=2.26",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
necessa = "app.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
