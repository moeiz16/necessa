name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      LLM_FAKE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests
      - name: Tests
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Retrieval regression gate (offline, fixtures)
        run: python -m app.cli eval run --suite retrieval --source fixtures --gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r <(python - <<'EOF'
          import tomllib; d = tomllib.load(open("backend/pyproject.toml", "rb"))
          print("\n".join(d["project"]["dependencies"]))
          EOF
          ) || true
      - name: SAST (Bandit)
        run: |
          python -m pip install bandit
          bandit -q -r backend/app -x backend/tests -ll
