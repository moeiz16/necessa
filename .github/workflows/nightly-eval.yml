name: nightly-eval

# Offline suites ($0, deterministic) run every night and on demand; the live suite (free-tier models via
# LiteLLM) runs only when provider secrets are configured and is capped to protect free quotas.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live-model verdict suite (uses free-tier quota)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-eval
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      LLM_FAKE: "true"
      DATABASE_URL: sqlite+aiosqlite:///./eval.db
      PHI_ENCRYPTION_KEY: ${{ secrets.EVAL_PHI_KEY || 'q8QGKZ0XyQm2b5hR3r6T7mFJw0sYk9aHn4LcV1pD2eE=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Criteria grounding (curated sets verbatim in policy text)
        run: python ../eval/harness/run.py --suite criteria --fail-on-gate
      - name: Safety / red team
        run: python ../eval/harness/run.py --suite safety --fail-on-gate
      - name: Verdict pipeline (counterfactual cases, oracle + degraded)
        run: python ../eval/harness/run.py --suite verdicts --fail-on-gate
      - name: Letter faithfulness
        run: python ../eval/harness/run.py --suite faithfulness --fail-on-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports-offline
          path: eval/reports/
          retention-days: 30

  live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      LLM_FAKE: "false"
      DATABASE_URL: sqlite+aiosqlite:///./eval.db
      PHI_ENCRYPTION_KEY: ${{ secrets.EVAL_PHI_KEY || 'q8QGKZ0XyQm2b5hR3r6T7mFJw0sYk9aHn4LcV1pD2eE=' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Live verdict suite (capped)
        run: python ../eval/harness/run.py --suite verdicts --live --limit 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports-live
          path: eval/reports/
          retention-days: 30
